name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          page=$(curl -fsSL https://merchantsguild.org/sell.html)
          url=$(echo "$page" | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -n1)
          key=$(echo "$page" | grep -oE 'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | head -n1)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Couldn't find the Supabase address or key on sell.html"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url/rest/v1/waitlist?select=*&limit=1" -H "apikey: $key")
          echo "Supabase answered: $status"
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "Supabase didn't respond. It may be paused."
            exit 1
          fi
